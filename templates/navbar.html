<nav class="navbar">
  <div class="navbar-wrap">
    <a href="/" class="navbar-logo">Do You Know Ball API</a>
    <div class="navbar-buttons" id="navbarButtons">
      <a href="/register" class="btn btn-outline" id="registerBtn">Register</a>
      <a href="/login" class="btn btn-primary" id="loginBtn">Login</a>
      <a href="/api-keys" class="btn btn-primary" id="apiKeysBtn" style="display:none;">API Keys</a>
      <button class="btn btn-outline" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<style rel="stylesheet" href="/static/style.css"></style>

<script>
  function checkAuthStatus() {
    const token = getCookie("token");
    const username = getCookie("username");
    
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const apiKeysBtn = document.getElementById("apiKeysBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (token && username) {
      registerBtn.style.display = "none";
      loginBtn.style.display = "none";
      apiKeysBtn.style.display = "block";
      logoutBtn.style.display = "block";
    } else {
      registerBtn.style.display = "block";
      loginBtn.style.display = "block";
      apiKeysBtn.style.display = "none";
      logoutBtn.style.display = "none";
    }
  }

  function getCookie(name) {
    const nameEQ = name + "=";
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      c = c.trim();
      if (c.indexOf(nameEQ) === 0) {
        return c.substring(nameEQ.length);
      }
    }
    return null;
  }

  function logout() {
    document.cookie = "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    document.cookie = "username=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    checkAuthStatus();
    window.location.href = "/";
  }

  document.addEventListener("DOMContentLoaded", checkAuthStatus);
</script>
